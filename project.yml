name: Topliner
options:
  bundleIdPrefix: com.schoi80
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AudioKit:
    url: https://github.com/AudioKit/AudioKit.git
    from: 5.7.2
  SoundpipeAudioKit:
    url: https://github.com/AudioKit/SoundpipeAudioKit.git
    from: 5.7.4
schemes:
  Topliner:
    build:
      targets:
        Topliner: all
        ToplinerTests: [test]
    test:
      targets:
        - ToplinerTests

targets:
  Topliner:
    type: application
    platform: iOS
    sources:
      - Topliner
    dependencies:
      - package: AudioKit
        product: AudioKit
      - package: SoundpipeAudioKit
        product: SoundpipeAudioKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schoi80.topliner
        INFOPLIST_KEY_CFBundleDisplayName: Topliner
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    info:
      path: Topliner/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: Topliner needs microphone access to record vocal ideas and convert them into MIDI notes.
        UILaunchScreen: {}
  ToplinerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ToplinerTests
    dependencies:
      - target: Topliner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schoi80.topliner.tests
        GENERATE_INFOPLIST_FILE: YES
  ToplinerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ToplinerUITests
    dependencies:
      - target: Topliner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schoi80.topliner.uitests
        GENERATE_INFOPLIST_FILE: YES
